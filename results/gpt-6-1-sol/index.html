<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사계절의 나무</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #cde5ec; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .caption {
    position: fixed; top: 28px; left: 30px;
    color: #253a34; pointer-events: none;
  }
  .caption small { font-size: 11px; letter-spacing: .25em; }
  .caption h1 { margin: 7px 0; font-size: 18px; font-weight: 500; }
  .season-card {
    position: fixed; right: 28px; bottom: 28px;
    width: 220px; padding: 21px 24px;
    border: 1px solid #ffffff90; border-radius: 20px;
    background: #ffffff75; backdrop-filter: blur(14px);
    color: #263c35; box-shadow: 0 8px 35px #23382b0c;
  }
  #season { font-size: 34px; font-weight: 600; }
  #description { margin-top: 5px; font-size: 12px; }
  .track { height: 3px; margin-top: 20px; background: #263c3518; overflow: hidden; }
  #progress { height: 100%; background: #577c60; transform-origin: left; }
  .labels { display: flex; justify-content: space-between; margin-top: 11px; font-size: 11px; }
  .labels span { opacity: .35; transition: opacity 1s; }
  .labels span.active { opacity: 1; font-weight: 700; }
  #error {
    display: none; position: fixed; inset: 0; padding: 30px;
    place-content: center; text-align: center; color: #263c35;
  }
  @media (max-width: 600px) {
    .caption { top: 20px; left: 20px; }
    .season-card { right: 18px; bottom: 18px; width: 190px; padding: 18px 20px; }
  }
</style>
</head>
<body>
<header class="caption">
  <small>빛과 바람의 작은 풍경</small>
  <h1>사계절의 나무</h1>
</header>
<aside class="season-card">
  <div id="season" aria-live="polite">봄</div>
  <div id="description">꽃잎 사이로 시작되는 계절</div>
  <div class="track"><div id="progress"></div></div>
  <div class="labels">
    <span class="active">봄</span><span>여름</span><span>가을</span><span>겨울</span>
  </div>
</aside>
<div id="error">3D 화면을 불러오지 못했습니다.<br>인터넷 연결을 확인하고 새로고침해 주세요.</div>

<script type="module">
try {
  // 버전을 고정한 유일한 외부 의존성. 모든 형상은 코드로 생성합니다.
  const THREE = await import(
    'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'
  );

  const scene = new THREE.Scene();
  scene.background = new THREE.Color();
  scene.fog = new THREE.Fog(0xcde5ec, 32, 85);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  renderer.domElement.setAttribute('aria-label', '언덕 위 나무의 사계절 3D 애니메이션');
  document.body.prepend(renderer.domElement);

  const camera = new THREE.PerspectiveCamera(43, innerWidth / innerHeight, .1, 140);
  const hemisphere = new THREE.HemisphereLight(0xffffff, 0x728452, 2.1);
  scene.add(hemisphere);

  const sunlight = new THREE.DirectionalLight(0xfff3d8, 3);
  sunlight.position.set(-9, 17, 8);
  sunlight.castShadow = true;
  sunlight.shadow.mapSize.set(2048, 2048);
  Object.assign(sunlight.shadow.camera, {
    left: -11, right: 11, top: 14, bottom: -11, near: 1, far: 50
  });
  sunlight.shadow.normalBias = .035;
  sunlight.shadow.bias = -.00015;
  sunlight.shadow.camera.updateProjectionMatrix();
  scene.add(sunlight);

  // 固定シードの乱数で、毎回同じ木を育てます。
  let seed = 57219;
  function random() {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  const range = (a, b) => a + (b - a) * random();
  const clamp = x => Math.max(0, Math.min(1, x));
  const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
  const up = new THREE.Vector3(0, 1, 0);
  const dummy = new THREE.Object3D();

  function height(x, z) {
    return 2.65 * Math.exp(-(x * x + z * z) / 105)
      + .15 * Math.sin(x * .2) * Math.cos(z * .18);
  }

  const groundGeometry = new THREE.PlaneGeometry(160, 160, 160, 160);
  groundGeometry.rotateX(-Math.PI / 2);
  const groundPositions = groundGeometry.attributes.position;
  for (let i = 0; i < groundPositions.count; i++) {
    groundPositions.setY(i, height(groundPositions.getX(i), groundPositions.getZ(i)));
  }
  groundGeometry.computeVertexNormals();
  const groundMaterial = new THREE.MeshStandardMaterial({
    color: 0x93bc70, roughness: 1
  });
  const ground = new THREE.Mesh(groundGeometry, groundMaterial);
  ground.receiveShadow = true;
  scene.add(ground);

  const tree = new THREE.Group();
  scene.add(tree);
  const bark = new THREE.MeshStandardMaterial({ color: 0x70503c, roughness: .95 });
  const branchGeometry = new THREE.CylinderGeometry(.72, 1, 1, 8);
  const snowMaterial = new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 1, transparent: true, opacity: 0,
    depthWrite: false
  });
  const branchSnow = new THREE.Group();
  tree.add(branchSnow);
  const tips = [];

  function branch(a, b, radius, snowy = true) {
    const direction = b.clone().sub(a);
    const mesh = new THREE.Mesh(branchGeometry, bark);
    mesh.position.copy(a).add(b).multiplyScalar(.5);
    mesh.quaternion.setFromUnitVectors(up, direction.clone().normalize());
    mesh.scale.set(radius, direction.length(), radius);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    tree.add(mesh);

    if (snowy) {
      const cover = new THREE.Mesh(branchGeometry, snowMaterial);
      cover.position.copy(mesh.position);
      cover.position.y += radius * .6;
      cover.quaternion.copy(mesh.quaternion);
      cover.scale.set(radius * .72, direction.length() * .98, radius * .72);
      branchSnow.add(cover);
    }
  }

  const rootY = height(0, 0);
  const trunk = [
    new THREE.Vector3(0, rootY - .08, 0),
    new THREE.Vector3(.10, rootY + 1.3, .04),
    new THREE.Vector3(-.08, rootY + 2.6, -.04),
    new THREE.Vector3(.13, rootY + 3.7, .03)
  ];
  for (let i = 0; i < trunk.length - 1; i++) {
    branch(trunk[i], trunk[i + 1], .34 - i * .07, false);
  }
  for (let i = 0; i < 6; i++) {
    const angle = i * Math.PI / 3;
    const x = Math.cos(angle) * .85, z = Math.sin(angle) * .85;
    branch(new THREE.Vector3(0, rootY + .35, 0),
      new THREE.Vector3(x, height(x, z) + .025, z), .16, false);
  }

  function grow(start, direction, length, radius, depth) {
    const end = start.clone().addScaledVector(direction, length);
    branch(start, end, radius);
    if (depth === 0) {
      tips.push(end);
      return;
    }
    const heading = Math.atan2(direction.z, direction.x);
    for (let i = 0; i < 3; i++) {
      const angle = heading + (i - 1) * .85 + range(-.2, .2);
      const childDirection = new THREE.Vector3(
        Math.cos(angle) * range(.65, 1),
        range(.35, .85),
        Math.sin(angle) * range(.65, 1)
      ).normalize();
      grow(end, childDirection, length * .65, radius * .57, depth - 1);
    }
  }

  for (let i = 0; i < 8; i++) {
    const angle = i * Math.PI * 2 / 8;
    const start = new THREE.Vector3(.02, rootY + 2.05 + i * .19, 0);
    const direction = new THREE.Vector3(
      Math.cos(angle) * .83, .56 + (i % 3) * .12, Math.sin(angle) * .83
    ).normalize();
    grow(start, direction, 1.8, .16, 2);
  }
  grow(trunk[3], new THREE.Vector3(.08, 1, -.05).normalize(), .9, .11, 2);

  // 저다각형 입체 잎.
  const foliage = [];
  for (const tip of tips) {
    for (let i = 0; i < 18; i++) {
      const direction = new THREE.Vector3(
        range(-1, 1), range(-.65, 1), range(-1, 1)
      ).normalize();
      const position = tip.clone().addScaledVector(direction, range(.12, .65));
      foliage.push({
        position,
        rotation: new THREE.Euler(range(0, Math.PI), range(0, Math.PI), range(0, Math.PI)),
        size: range(.75, 1.3),
        threshold: random() * .86,
        phase: random() * Math.PI * 2,
        tint: random()
      });
    }
  }

  const leafGeometry = new THREE.IcosahedronGeometry(.17, 0);
  const leafMaterial = new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: .85
  });
  const leaves = new THREE.InstancedMesh(leafGeometry, leafMaterial, foliage.length);
  leaves.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  leaves.castShadow = true;
  leaves.receiveShadow = true;
  leaves.frustumCulled = false;
  tree.add(leaves);

  // 다섯 꽃잎과 노란 꽃술을 가진 꽃.
  const flowerShape = new THREE.Shape();
  for (let i = 0; i <= 60; i++) {
    const angle = i / 60 * Math.PI * 2;
    const radius = .125 * (1 + .3 * Math.cos(angle * 5));
    const x = Math.cos(angle) * radius, y = Math.sin(angle) * radius;
    if (i === 0) flowerShape.moveTo(x, y);
    else flowerShape.lineTo(x, y);
  }
  const flowerData = foliage.filter((_, i) => i % 4 === 0);
  const flowers = new THREE.InstancedMesh(
    new THREE.ShapeGeometry(flowerShape),
    new THREE.MeshStandardMaterial({
      color: 0xffbfd1, roughness: .7, side: THREE.DoubleSide
    }),
    flowerData.length
  );
  const flowerCenters = new THREE.InstancedMesh(
    new THREE.SphereGeometry(.028, 6, 4),
    new THREE.MeshStandardMaterial({ color: 0xffdf8b, roughness: .8 }),
    flowerData.length
  );
  flowers.frustumCulled = flowerCenters.frustumCulled = false;
  flowers.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  flowerCenters.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  tree.add(flowers, flowerCenters);

  // 낙엽은 잎과 같은 형상을 사용하며, 가지에서 땅으로 떨어집니다.
  const fallingData = Array.from({ length: 100 }, () => ({
    source: foliage[Math.floor(random() * foliage.length)].position.clone(),
    offset: random(),
    speed: range(.13, .22),
    drift: range(-1.4, 1.4),
    phase: range(0, Math.PI * 2),
    size: range(.7, 1.15)
  }));
  const fallingMaterial = new THREE.MeshStandardMaterial({
    color: 0xd78130, roughness: .9, transparent: true, opacity: 0,
    depthWrite: false
  });
  const fallingLeaves = new THREE.InstancedMesh(
    leafGeometry, fallingMaterial, fallingData.length
  );
  fallingLeaves.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  fallingLeaves.frustumCulled = false;
  scene.add(fallingLeaves);

  // 눈송이: 이미지 없이 원형에 가까운 점을 셰이더로 그립니다.
  const snowCount = 950;
  const snowData = Array.from({ length: snowCount }, () => ({
    x: range(-15, 15), z: range(-14, 14), offset: random(),
    speed: range(.045, .09), phase: range(0, Math.PI * 2)
  }));
  const snowGeometry = new THREE.BufferGeometry();
  snowGeometry.setAttribute('position',
    new THREE.BufferAttribute(new Float32Array(snowCount * 3), 3));
  const snowPointsMaterial = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    uniforms: {
      opacity: { value: 0 },
      pixelRatio: { value: renderer.getPixelRatio() }
    },
    vertexShader: `
      uniform float pixelRatio;
      void main() {
        vec4 p = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * p;
        gl_PointSize = clamp(65.0 * pixelRatio / -p.z, 1.5, 7.0 * pixelRatio);
      }
    `,
    fragmentShader: `
      uniform float opacity;
      void main() {
        float d = length(gl_PointCoord - vec2(0.5));
        float a = 1.0 - smoothstep(0.25, 0.5, d);
        gl_FragColor = vec4(1.0, 1.0, 1.0, a * opacity);
      }
    `
  });
  const snow = new THREE.Points(snowGeometry, snowPointsMaterial);
  snow.frustumCulled = false;
  scene.add(snow);

  // 구름과 해 역시 기본 도형만 사용합니다.
  const cloudMaterial = new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 1, transparent: true, opacity: .78
  });
  const cloudGeometry = new THREE.SphereGeometry(1, 12, 8);
  const clouds = [];
  for (let i = 0; i < 5; i++) {
    const cloud = new THREE.Group();
    for (let j = 0; j < 5; j++) {
      const puff = new THREE.Mesh(cloudGeometry, cloudMaterial);
      puff.position.set(j * 1.35, Math.sin(j * 1.9) * .3, range(-.3, .3));
      puff.scale.set(range(1.2, 1.8), range(.6, 1), 1);
      cloud.add(puff);
    }
    cloud.position.set(-28 + i * 13, 15 + i % 2 * 3, -28 - i % 3 * 4);
    scene.add(cloud);
    clouds.push(cloud);
  }
  const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffedb2 });
  const sun = new THREE.Mesh(new THREE.SphereGeometry(1.7, 24, 16), sunMaterial);
  sun.position.set(-17, 19, -32);
  scene.add(sun);

  const seasons = [
    { name: '봄', text: '꽃잎 사이로 시작되는 계절',
      sky: 0xcde5ec, ground: 0x9cbd76, light: 0xfff2dc, intensity: 3.0 },
    { name: '여름', text: '짙은 초록과 따뜻한 햇살',
      sky: 0x88c7e5, ground: 0x61944c, light: 0xfff4dc, intensity: 3.5 },
    { name: '가을', text: '물드는 가지, 흩날리는 낙엽',
      sky: 0xe9cba9, ground: 0xb89559, light: 0xffd6a0, intensity: 2.7 },
    { name: '겨울', text: '고요한 가지 위로 내려앉는 눈',
      sky: 0xbdcfdf, ground: 0xebf1f5, light: 0xe1ecff, intensity: 2.0 }
  ];
  for (const season of seasons) {
    season.sky = new THREE.Color(season.sky);
    season.ground = new THREE.Color(season.ground);
    season.light = new THREE.Color(season.light);
  }

  const leafColors = [
    new THREE.Color(0xa4ca68),
    new THREE.Color(0x388a42),
    new THREE.Color(0xe6972c),
    new THREE.Color(0xe6972c)
  ];
  const autumnRed = new THREE.Color(0xba4430);
  const mixedColor = new THREE.Color();
  const leafColor = new THREE.Color();
  const seasonElement = document.getElementById('season');
  const descriptionElement = document.getElementById('description');
  const progressElement = document.getElementById('progress');
  const labels = document.querySelectorAll('.labels span');
  let previousSeason = -1;

  function blendProperty(target, key, weights) {
    target.setRGB(0, 0, 0);
    for (let i = 0; i < 4; i++) target.addScaledColor(seasons[i][key], weights[i]);
  }

  // Color에는 addScaledColor가 없으므로, 선형 색상 공간에서 직접 보간합니다.
  function blend(target, colors, weights) {
    let r = 0, g = 0, b = 0;
    for (let i = 0; i < 4; i++) {
      r += colors[i].r * weights[i];
      g += colors[i].g * weights[i];
      b += colors[i].b * weights[i];
    }
    return target.setRGB(r, g, b);
  }
  const skyColors = seasons.map(s => s.sky);
  const groundColors = seasons.map(s => s.ground);
  const lightColors = seasons.map(s => s.light);
  const startTime = performance.now();

  function animate(now) {
    requestAnimationFrame(animate);
    const elapsed = (now - startTime) / 1000;
    const cycle = elapsed % 40;
    const current = Math.floor(cycle / 10);
    const local = cycle - current * 10;

    // 각 계절은 정확히 10초. 마지막 2.4초 동안 다음 계절로 부드럽게 전환.
    const transition = smooth((local - 7.6) / 2.4);
    const weights = [0, 0, 0, 0];
    weights[current] = 1 - transition;
    weights[(current + 1) % 4] = transition;

    if (current !== previousSeason) {
      seasonElement.textContent = seasons[current].name;
      descriptionElement.textContent = seasons[current].text;
      labels.forEach((label, i) => label.classList.toggle('active', i === current));
      previousSeason = current;
    }
    progressElement.style.transform = `scaleX(${local / 10})`;

    blend(scene.background, skyColors, weights);
    scene.fog.color.copy(scene.background);
    blend(groundMaterial.color, groundColors, weights);
    blend(sunlight.color, lightColors, weights);
    hemisphere.color.copy(scene.background).lerp(new THREE.Color(0xffffff), .65);
    hemisphere.groundColor.copy(groundMaterial.color);
    sunlight.intensity = seasons.reduce((sum, s, i) => sum + s.intensity * weights[i], 0);
    cloudMaterial.color.copy(scene.background).lerp(new THREE.Color(0xffffff), .8);
    sunMaterial.color.copy(sunlight.color);
    snowMaterial.opacity = weights[3] * .85;
    branchSnow.visible = weights[3] > .001;

    // 가을이 깊어질수록 잎의 수가 줄어듭니다.
    const autumnProgress = current === 2 ? smooth(local / 10) : 0;
    const coverage = weights[0] * .36 + weights[1]
      + weights[2] * (1 - autumnProgress * .88);
    blend(mixedColor, leafColors, weights);

    for (let i = 0; i < foliage.length; i++) {
      const leaf = foliage[i];
      const growth = smooth((coverage - leaf.threshold) / .14);
      const sway = Math.sin(elapsed * 1.6 + leaf.phase) * .045;
      dummy.position.copy(leaf.position);
      dummy.position.x += sway;
      dummy.rotation.copy(leaf.rotation);
      dummy.rotation.z += sway * 2;
      const size = leaf.size * growth;
      dummy.scale.set(size * .65, size * 1.35, size * .25);
      dummy.updateMatrix();
      leaves.setMatrixAt(i, dummy.matrix);

      leafColor.copy(mixedColor);
      leafColor.lerp(autumnRed, weights[2] * leaf.tint * .85);
      leafColor.multiplyScalar(.83 + leaf.tint * .32);
      leaves.setColorAt(i, leafColor);
    }
    leaves.instanceMatrix.needsUpdate = true;
    if (leaves.instanceColor) leaves.instanceColor.needsUpdate = true;

    for (let i = 0; i < flowerData.length; i++) {
      const flower = flowerData[i];
      const size = weights[0] * flower.size;
      dummy.position.copy(flower.position);
      dummy.position.x += Math.sin(elapsed * 1.6 + flower.phase) * .045;
      dummy.rotation.copy(flower.rotation);
      dummy.scale.setScalar(size);
      dummy.updateMatrix();
      flowers.setMatrixAt(i, dummy.matrix);
      dummy.translateZ(.018);
      dummy.updateMatrix();
      flowerCenters.setMatrixAt(i, dummy.matrix);
    }
    flowers.instanceMatrix.needsUpdate = true;
    flowerCenters.instanceMatrix.needsUpdate = true;
    flowers.visible = flowerCenters.visible = weights[0] > .001;

    fallingMaterial.opacity = weights[2] * .95;
    fallingLeaves.visible = weights[2] > .001;
    for (let i = 0; i < fallingData.length; i++) {
      const leaf = fallingData[i];
      const phase = (elapsed * leaf.speed + leaf.offset) % 1;
      const x = leaf.source.x + leaf.drift * phase * 2
        + Math.sin(phase * 9 + leaf.phase) * .35;
      const z = leaf.source.z + Math.sin(phase * 5 + leaf.phase) * .7;
      const floor = height(x, z) + .045;
      const y = leaf.source.y - phase * 8;
      dummy.position.set(x, Math.max(floor, y), z);
      dummy.rotation.set(phase * 10 + leaf.phase, phase * 8, phase * 7);
      // 잠시 바닥에 머문 뒤 사라져 다음 낙엽으로 이어집니다.
      const size = leaf.size * (1 - smooth((phase - .84) / .16));
      dummy.scale.set(size * .65, size * 1.35, size * .25);
      dummy.updateMatrix();
      fallingLeaves.setMatrixAt(i, dummy.matrix);
    }
    fallingLeaves.instanceMatrix.needsUpdate = true;

    snow.visible = weights[3] > .001;
    snowPointsMaterial.uniforms.opacity.value = weights[3] * .85;
    if (snow.visible) {
      const positions = snowGeometry.attributes.position;
      for (let i = 0; i < snowCount; i++) {
        const flake = snowData[i];
        const phase = (elapsed * flake.speed + flake.offset) % 1;
        const x = flake.x + Math.sin(elapsed * .35 + flake.phase) * .8;
        const z = flake.z + Math.cos(elapsed * .2 + flake.phase) * .45;
        positions.setXYZ(i, x, height(x, z) + (1 - phase) * 16, z);
      }
      positions.needsUpdate = true;
    }

    clouds.forEach((cloud, i) => {
      cloud.position.x = -28 + i * 13 + Math.sin(elapsed * .025 + i) * 3;
    });

    const distance = Math.max(20, 10 / camera.aspect);
    const angle = .57 + Math.sin(elapsed * .065) * .045;
    camera.position.set(
      Math.sin(angle) * distance,
      5.3 + distance * .22,
      Math.cos(angle) * distance
    );
    camera.lookAt(0, 5.25, 0);
    renderer.render(scene, camera);
  }

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    snowPointsMaterial.uniforms.pixelRatio.value = renderer.getPixelRatio();
  });

  requestAnimationFrame(animate);
} catch (error) {
  document.getElementById('error').style.display = 'grid';
  console.error(error);
}
</script>
</body>
</html>
