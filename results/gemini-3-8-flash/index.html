<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사계절의 나무 (Four Seasons Tree)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* 계절 안내 UI */
    .season-ui {
      position: absolute;
      top: 32px;
      left: 32px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 20px;
      padding: 22px 28px;
      color: #fff;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.15);
      min-width: 240px;
      pointer-events: none;
      transition: all 0.5s ease;
    }

    .season-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.85;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .season-badge::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .season-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.1;
      margin-bottom: 6px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .season-desc {
      font-size: 13px;
      opacity: 0.9;
      font-weight: 400;
      line-height: 1.4;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    /* 계절 진행도 바 */
    .timeline {
      margin-top: 16px;
      height: 4px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    .timeline-progress {
      height: 100%;
      width: 0%;
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    .hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      letter-spacing: 0.5px;
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 18px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
  </style>
  <!-- 고정 버전 Three.js 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="season-ui" id="seasonUi">
    <div class="season-badge" id="seasonBadge">Season</div>
    <div class="season-title" id="seasonTitle">봄</div>
    <div class="season-desc" id="seasonDesc">따스한 바람과 흩날리는 벚꽃</div>
    <div class="timeline">
      <div class="timeline-progress" id="timelineBar"></div>
    </div>
  </div>

  <div class="hint">마우스를 드래그하여 시점을 회전할 수 있습니다</div>

  <script>
    // --- 1. 기본 설정 및 씬 초기화 ---
    const CYCLE_DURATION = 40.0; // 1회 순환 40초 (계절당 10초)
    const SEASONS = [
      { name: '봄', en: 'Spring', desc: '따스한 바람과 흩날리는 벚꽃', badgeColor: '#ff9ebb' },
      { name: '여름', en: 'Summer', desc: '눈부신 햇살과 무성한 녹음', badgeColor: '#4ade80' },
      { name: '가을', en: 'Autumn', desc: '황금빛 들녘과 붉게 물든 단풍', badgeColor: '#f97316' },
      { name: '겨울', en: 'Winter', desc: '고요한 언덕과 춤추는 눈송이', badgeColor: '#93c5fd' }
    ];

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 7, 24);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // --- 2. 조명 시스템 ---
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(15, 25, 15);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 60;
    dirLight.shadow.camera.left = -15;
    dirLight.shadow.camera.right = 15;
    dirLight.shadow.camera.top = 15;
    dirLight.shadow.camera.bottom = -15;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);

    // 안개 (계절 색상과 블렌딩)
    const fog = new THREE.FogExp2(0xcce0ff, 0.022);
    scene.fog = fog;

    // --- 3. 언덕 (지형) 생성 ---
    const hillGeometry = new THREE.SphereGeometry(22, 64, 48);
    hillGeometry.scale(1.6, 0.45, 1.6); // 완만하고 넓은 언덕 모양
    const hillMaterial = new THREE.MeshStandardMaterial({
      roughness: 0.85,
      metalness: 0.05,
      flatShading: true
    });
    const hill = new THREE.Mesh(hillGeometry, hillMaterial);
    hill.position.y = -9.5;
    hill.receiveShadow = true;
    scene.add(hill);

    // 언덕 위 장식용 잔디/꽃 덤불 (절차적 생성)
    const decorGroup = new THREE.Group();
    const decorGeo = new THREE.DodecahedronGeometry(0.2, 0);
    const decorMat = new THREE.MeshStandardMaterial({ roughness: 0.9, flatShading: true });
    const decorInstanced = new THREE.InstancedMesh(decorGeo, decorMat, 120);
    const dummy = new THREE.Object3D();

    for (let i = 0; i < 120; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 3.5 + Math.random() * 11;
      const x = Math.cos(angle) * dist;
      const z = Math.sin(angle) * dist;
      // 언덕 곡면에 맞춘 y 위치 근사
      const y = 0.5 - (dist * dist) * 0.025 + (Math.random() * 0.1);
      const s = 0.6 + Math.random() * 0.9;
      dummy.position.set(x, y, z);
      dummy.scale.set(s, s * (0.8 + Math.random() * 0.6), s);
      dummy.rotation.set(Math.random() * 0.3, Math.random() * Math.PI, Math.random() * 0.3);
      dummy.updateMatrix();
      decorInstanced.setMatrixAt(i, dummy.matrix);
    }
    decorInstanced.receiveShadow = true;
    decorGroup.add(decorInstanced);
    scene.add(decorGroup);

    // --- 4. 나무(줄기 및 가지) 생성 ---
    const treeGroup = new THREE.Group();
    scene.add(treeGroup);

    const woodMaterial = new THREE.MeshStandardMaterial({
      color: 0x4a3222,
      roughness: 0.9,
      metalness: 0.1,
      flatShading: true
    });

    const leafPositions = [];

    // 재귀적 브랜칭 알고리즘
    function createBranch(start, dir, length, radius, depth) {
      if (depth > 4) {
        leafPositions.push(start.clone());
        return;
      }

      const end = start.clone().add(dir.clone().multiplyScalar(length));
      const mid = start.clone().add(end).multiplyScalar(0.5);

      const branchGeo = new THREE.CylinderGeometry(radius * 0.68, radius, length, 7);
      const branchMesh = new THREE.Mesh(branchGeo, woodMaterial);
      branchMesh.castShadow = true;
      branchMesh.receiveShadow = true;

      // 실린더를 방향 벡터로 회전
      const orientation = new THREE.Matrix4();
      const up = new THREE.Vector3(0, 1, 0);
      orientation.lookAt(start, end, up);
      orientation.multiply(new THREE.Matrix4().makeRotationX(Math.PI / 2));
      branchMesh.applyMatrix4(orientation);
      branchMesh.position.copy(mid);

      treeGroup.add(branchMesh);

      // 가지치기 수 및 각도 계산
      const subBranches = depth === 0 ? 3 : (Math.random() > 0.3 ? 3 : 2);
      for (let i = 0; i < subBranches; i++) {
        const angleSpread = 0.45 + Math.random() * 0.3;
        const rotAngle = (i / subBranches) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;

        const newDir = dir.clone();
        const axis1 = new THREE.Vector3(Math.cos(rotAngle), 0, Math.sin(rotAngle)).normalize();
        newDir.applyAxisAngle(axis1, angleSpread);
        newDir.y += 0.2; // 위쪽으로 유도
        newDir.normalize();

        createBranch(end, newDir, length * (0.68 + Math.random() * 0.1), radius * 0.65, depth + 1);
      }
    }

    // 메인 줄기 시작
    createBranch(new THREE.Vector3(0, 0.4, 0), new THREE.Vector3(0, 1, 0), 3.2, 0.62, 0);

    // --- 5. 나뭇잎 덩어리(Canopy) 생성 ---
    const foliageGroup = new THREE.Group();
    treeGroup.add(foliageGroup);

    const leafMeshes = [];
    const leafGeo = new THREE.DodecahedronGeometry(1.0, 1);

    leafPositions.forEach((pos) => {
      // 끝단 가지 주위에 풍성한 구형 나뭇잎 클러스터 배치
      const clusterCount = 2 + Math.floor(Math.random() * 2);
      for (let i = 0; i < clusterCount; i++) {
        const mat = new THREE.MeshStandardMaterial({
          roughness: 0.6,
          metalness: 0.1,
          flatShading: true
        });
        const mesh = new THREE.Mesh(leafGeo, mat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;

        const offset = new THREE.Vector3(
          (Math.random() - 0.5) * 1.6,
          (Math.random() - 0.3) * 1.4,
          (Math.random() - 0.5) * 1.6
        );
        mesh.position.copy(pos).add(offset);
        const baseScale = 0.85 + Math.random() * 0.75;
        mesh.scale.setScalar(baseScale);
        mesh.userData = {
          baseScale: baseScale,
          seed: Math.random() * Math.PI * 2
        };

        leafMeshes.push(mesh);
        foliageGroup.add(mesh);
      }
    });

    // 가지 위에 쌓이는 겨울철 눈 캡 메쉬
    const snowCapGroup = new THREE.Group();
    treeGroup.add(snowCapGroup);
    const snowCapMat = new THREE.MeshStandardMaterial({
      color: 0xf5f8ff,
      roughness: 0.9,
      flatShading: true
    });
    leafPositions.forEach((pos) => {
      const cap = new THREE.Mesh(new THREE.DodecahedronGeometry(0.35, 1), snowCapMat);
      cap.position.copy(pos).add(new THREE.Vector3(0, 0.1, 0));
      cap.scale.set(1.4, 0.4, 1.4);
      snowCapGroup.add(cap);
    });

    // --- 6. 계절별 파티클 시스템 (꽃잎, 단풍, 눈) ---
    // (1) 봄 꽃잎 파티클
    const springCount = 500;
    const springGeo = new THREE.BufferGeometry();
    const springPos = new Float32Array(springCount * 3);
    const springVel = [];
    for (let i = 0; i < springCount; i++) {
      springPos[i * 3 + 0] = (Math.random() - 0.5) * 18;
      springPos[i * 3 + 1] = 2 + Math.random() * 12;
      springPos[i * 3 + 2] = (Math.random() - 0.5) * 18;
      springVel.push({
        y: -0.6 - Math.random() * 0.7,
        x: 0.8 + Math.random() * 0.7,
        sway: Math.random() * Math.PI * 2
      });
    }
    springGeo.setAttribute('position', new THREE.BufferAttribute(springPos, 3));
    const springMat = new THREE.PointsMaterial({
      color: 0xffb7c5,
      size: 0.22,
      transparent: true,
      opacity: 0.0,
      depthWrite: false
    });
    const springParticles = new THREE.Points(springGeo, springMat);
    scene.add(springParticles);

    // (2) 가을 낙엽 파티클
    const autumnCount = 450;
    const autumnGeo = new THREE.BufferGeometry();
    const autumnPos = new Float32Array(autumnCount * 3);
    const autumnVel = [];
    for (let i = 0; i < autumnCount; i++) {
      autumnPos[i * 3 + 0] = (Math.random() - 0.5) * 18;
      autumnPos[i * 3 + 1] = 2 + Math.random() * 12;
      autumnPos[i * 3 + 2] = (Math.random() - 0.5) * 18;
      autumnVel.push({
        y: -1.0 - Math.random() * 1.0,
        x: 0.6 + Math.random() * 0.8,
        sway: Math.random() * Math.PI * 2
      });
    }
    autumnGeo.setAttribute('position', new THREE.BufferAttribute(autumnPos, 3));
    const autumnMat = new THREE.PointsMaterial({
      color: 0xe05615,
      size: 0.26,
      transparent: true,
      opacity: 0.0,
      depthWrite: false
    });
    const autumnParticles = new THREE.Points(autumnGeo, autumnMat);
    scene.add(autumnParticles);

    // (3) 겨울 눈송이 파티클
    const winterCount = 1200;
    const winterGeo = new THREE.BufferGeometry();
    const winterPos = new Float32Array(winterCount * 3);
    const winterVel = [];
    for (let i = 0; i < winterCount; i++) {
      winterPos[i * 3 + 0] = (Math.random() - 0.5) * 30;
      winterPos[i * 3 + 1] = Math.random() * 16;
      winterPos[i * 3 + 2] = (Math.random() - 0.5) * 30;
      winterVel.push({
        y: -0.7 - Math.random() * 0.9,
        x: (Math.random() - 0.5) * 0.4,
        sway: Math.random() * Math.PI * 2
      });
    }
    winterGeo.setAttribute('position', new THREE.BufferAttribute(winterPos, 3));
    const winterMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.18,
      transparent: true,
      opacity: 0.0,
      depthWrite: false
    });
    const winterParticles = new THREE.Points(winterGeo, winterMat);
    scene.add(winterParticles);

    // --- 7. 계절별 팔레트 및 가중치 함수 ---
    const PALETTES = {
      spring: {
        sky: new THREE.Color(0xa7d8ff),
        fog: new THREE.Color(0xd2eaff),
        ground: new THREE.Color(0x7ec66f),
        decor: new THREE.Color(0xff8fb1),
        leaves: new THREE.Color(0xffa4be),
        leafScale: 0.85,
        sunColor: new THREE.Color(0xfff1dc),
        sunIntensity: 1.15
      },
      summer: {
        sky: new THREE.Color(0x3ea6ff),
        fog: new THREE.Color(0x82c8ff),
        ground: new THREE.Color(0x2f963b),
        decor: new THREE.Color(0x38b000),
        leaves: new THREE.Color(0x1e8234),
        leafScale: 1.08,
        sunColor: new THREE.Color(0xfffae6),
        sunIntensity: 1.45
      },
      autumn: {
        sky: new THREE.Color(0xdf824b),
        fog: new THREE.Color(0xebb079),
        ground: new THREE.Color(0x8c6130),
        decor: new THREE.Color(0xd97706),
        leaves: new THREE.Color(0xc94014),
        leafScale: 0.92,
        sunColor: new THREE.Color(0xff9944),
        sunIntensity: 1.1
      },
      winter: {
        sky: new THREE.Color(0x8fa1b8),
        fog: new THREE.Color(0xb9c6d6),
        ground: new THREE.Color(0xeef4fa),
        decor: new THREE.Color(0xd1d9e2),
        leaves: new THREE.Color(0x94a3b8),
        leafScale: 0.001, // 잎이 모두 떨어지고 가지만 남음
        sunColor: new THREE.Color(0xdce7f5),
        sunIntensity: 0.75
      }
    };

    const paletteKeys = ['spring', 'summer', 'autumn', 'winter'];

    // 부드러운 가중치 계산 (Cosine bell curve 기반 보간)
    function getSeasonWeights(t) {
      // t는 0 ~ 4 사이의 연속된 값
      const weights = [];
      let sum = 0;
      for (let i = 0; i < 4; i++) {
        let diff = Math.abs(t - i);
        if (diff > 2) diff = 4 - diff;
        // 거리가 1 이내일 때 부드럽게 상승/하강
        const w = diff < 1 ? 0.5 * (1 + Math.cos(diff * Math.PI)) : 0;
        weights.push(w);
        sum += w;
      }
      return weights.map(w => w / (sum || 1));
    }

    // --- 8. 마우스 인터랙션 (카메라 회전 드래그) ---
    let isDragging = false;
    let prevMouseX = 0;
    let prevMouseY = 0;
    let cameraAngle = 0;
    let cameraHeight = 7;
    let cameraRadius = 24;

    window.addEventListener('mousedown', (e) => {
      isDragging = true;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
    });

    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - prevMouseX;
      const deltaY = e.clientY - prevMouseY;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;

      cameraAngle -= deltaX * 0.006;
      cameraHeight = Math.max(1.5, Math.min(18, cameraHeight + deltaY * 0.04));
    });

    // 터치 지원
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        prevMouseX = e.touches[0].clientX;
        prevMouseY = e.touches[0].clientY;
      }
    }, { passive: true });
    window.addEventListener('touchend', () => { isDragging = false; });
    window.addEventListener('touchmove', (e) => {
      if (!isDragging || e.touches.length !== 1) return;
      const deltaX = e.touches[0].clientX - prevMouseX;
      const deltaY = e.touches[0].clientY - prevMouseY;
      prevMouseX = e.touches[0].clientX;
      prevMouseY = e.touches[0].clientY;

      cameraAngle -= deltaX * 0.007;
      cameraHeight = Math.max(1.5, Math.min(18, cameraHeight + deltaY * 0.04));
    }, { passive: true });

    // 반응형 리사이즈
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 9. UI 요소 참조 ---
    const uiBadge = document.getElementById('seasonBadge');
    const uiTitle = document.getElementById('seasonTitle');
    const uiDesc = document.getElementById('seasonDesc');
    const uiBar = document.getElementById('timelineBar');

    // --- 10. 메인 애니메이션 루프 ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();
      const cycleTime = elapsedTime % CYCLE_DURATION;
      const cycleProgress = cycleTime / CYCLE_DURATION; // 0.0 ~ 1.0

      // 연속 계절 파라미터 (0.0: 봄, 1.0: 여름, 2.0: 가을, 3.0: 겨울)
      const seasonContinuous = cycleProgress * 4.0;
      const weights = getSeasonWeights(seasonContinuous);

      // (A) 색상 및 파라미터 가중 보간
      const finalSky = new THREE.Color(0, 0, 0);
      const finalFog = new THREE.Color(0, 0, 0);
      const finalGround = new THREE.Color(0, 0, 0);
      const finalDecor = new THREE.Color(0, 0, 0);
      const finalLeaves = new THREE.Color(0, 0, 0);
      const finalSun = new THREE.Color(0, 0, 0);
      let finalLeafScale = 0;
      let finalSunIntensity = 0;

      for (let i = 0; i < 4; i++) {
        const p = PALETTES[paletteKeys[i]];
        const w = weights[i];

        finalSky.addScaledColor(p.sky, w);
        finalFog.addScaledColor(p.fog, w);
        finalGround.addScaledColor(p.ground, w);
        finalDecor.addScaledColor(p.decor, w);
        finalLeaves.addScaledColor(p.leaves, w);
        finalSun.addScaledColor(p.sunColor, w);
        finalLeafScale += p.leafScale * w;
        finalSunIntensity += p.sunIntensity * w;
      }

      // 배경 및 조명 적용
      renderer.setClearColor(finalSky, 1);
      fog.color.copy(finalFog);
      hillMaterial.color.copy(finalGround);
      decorMat.color.copy(finalDecor);
      dirLight.color.copy(finalSun);
      dirLight.intensity = finalSunIntensity;

      // 눈 캡(겨울) 스케일 및 투명도: 겨울 가중치에 비례
      const winterW = weights[3];
      snowCapGroup.scale.setScalar(Math.min(1.0, winterW * 1.3));
      snowCapMat.opacity = Math.min(1.0, winterW * 1.5);
      snowCapMat.transparent = true;

      // (B) 나뭇잎 클러스터 변형 및 바람 효과
      const windBase = Math.sin(elapsedTime * 1.6) * 0.04;
      treeGroup.rotation.z = windBase * 0.4;
      treeGroup.rotation.x = Math.cos(elapsedTime * 1.2) * 0.02;

      leafMeshes.forEach((mesh) => {
        mesh.material.color.copy(finalLeaves);
        const flutter = 1.0 + Math.sin(elapsedTime * 3.0 + mesh.userData.seed) * 0.04;
        mesh.scale.setScalar(mesh.userData.baseScale * finalLeafScale * flutter);
      });

      // (C) 파티클 애니메이션
      // 1. 봄 꽃잎
      springMat.opacity = weights[0] * 0.9;
      if (springMat.opacity > 0.01) {
        const pos = springGeo.attributes.position.array;
        for (let i = 0; i < springCount; i++) {
          springVel[i].sway += 0.025;
          pos[i * 3 + 0] += Math.sin(springVel[i].sway) * 0.05 + 0.02;
          pos[i * 3 + 1] += springVel[i].y * 0.035;
          pos[i * 3 + 2] += Math.cos(springVel[i].sway) * 0.03;

          // 바닥에 닿으면 재배치
          if (pos[i * 3 + 1] < 0.2) {
            pos[i * 3 + 1] = 9 + Math.random() * 4;
            pos[i * 3 + 0] = (Math.random() - 0.5) * 12;
            pos[i * 3 + 2] = (Math.random() - 0.5) * 12;
          }
        }
        springGeo.attributes.position.needsUpdate = true;
      }

      // 2. 가을 단풍
      autumnMat.opacity = weights[2] * 0.95;
      if (autumnMat.opacity > 0.01) {
        const pos = autumnGeo.attributes.position.array;
        for (let i = 0; i < autumnCount; i++) {
          autumnVel[i].sway += 0.035;
          pos[i * 3 + 0] += Math.sin(autumnVel[i].sway) * 0.08 + 0.04;
          pos[i * 3 + 1] += autumnVel[i].y * 0.05;
          pos[i * 3 + 2] += Math.cos(autumnVel[i].sway) * 0.05;

          if (pos[i * 3 + 1] < 0.2) {
            pos[i * 3 + 1] = 9 + Math.random() * 4;
            pos[i * 3 + 0] = (Math.random() - 0.5) * 14;
            pos[i * 3 + 2] = (Math.random() - 0.5) * 14;
          }
        }
        autumnGeo.attributes.position.needsUpdate = true;
      }

      // 3. 겨울 눈송이
      winterMat.opacity = weights[3] * 0.95;
      if (winterMat.opacity > 0.01) {
        const pos = winterGeo.attributes.position.array;
        for (let i = 0; i < winterCount; i++) {
          winterVel[i].sway += 0.018;
          pos[i * 3 + 0] += Math.sin(winterVel[i].sway) * 0.03;
          pos[i * 3 + 1] += winterVel[i].y * 0.04;
          pos[i * 3 + 2] += Math.cos(winterVel[i].sway) * 0.02;

          if (pos[i * 3 + 1] < 0) {
            pos[i * 3 + 1] = 14 + Math.random() * 2;
            pos[i * 3 + 0] = (Math.random() - 0.5) * 28;
            pos[i * 3 + 2] = (Math.random() - 0.5) * 28;
          }
        }
        winterGeo.attributes.position.needsUpdate = true;
      }

      // (D) 카메라 부드러운 자동 선회 (드래그하지 않을 때)
      if (!isDragging) {
        cameraAngle += 0.0018;
      }
      camera.position.x = Math.sin(cameraAngle) * cameraRadius;
      camera.position.z = Math.cos(cameraAngle) * cameraRadius;
      camera.position.y = cameraHeight;
      camera.lookAt(0, 3.8, 0);

      // (E) UI 텍스트 및 프로그레스 갱신
      const currentSeasonIndex = Math.floor((seasonContinuous + 0.5) % 4);
      const activeSeason = SEASONS[currentSeasonIndex];
      uiTitle.textContent = activeSeason.name;
      uiDesc.textContent = activeSeason.desc;
      uiBadge.style.color = activeSeason.badgeColor;
      uiBadge.textContent = activeSeason.en;
      uiBar.style.width = `${(cycleProgress * 100).toFixed(1)}%`;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
