# GitHub Pages 배포 (docs/ARCHITECTURE.md "배포", ADR-017)
# 검사(lint·typecheck·test·check:results)와 빌드가 모두 통과해야만 배포한다. 하나라도 실패하면 배포하지 않는다.
# 공개 데이터만 다룬다: 비밀값을 쓰지 않고, 모델을 부르거나 results/를 바꾸는 명령을 넣지 않는다.
# 이 파일은 site/test/deploy-workflow.test.ts가 검사한다.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 끝까지 둔다
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # site·검증기 테스트가 실제 Chromium을 띄운다
      - run: npx playwright install --with-deps chromium

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:results

      - id: pages
        uses: actions/configure-pages@v6

      # base_path는 '/<레포 이름>'(끝 슬래시 없음) 또는 빈 값 → astro.config.mjs가 '/<레포 이름>/'·'/'로 맞춘다
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
